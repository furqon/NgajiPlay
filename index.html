<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ngajiPlay</title>
    <meta name="description" content="Rekam bacaan Al-Qur'an anak per surah, lalu putar ulang sambil melihat halaman Madani." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e4a3c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

  <body>
    <header class="chrome">
      <div class="chrome-row">
        <a class="brand" href="#/" aria-label="ngajiPlay">

            <circle cx="256" cy="256" r="176" fill="currentColor" />
            <path d="M218 176 L346 256 L218 336 Z" fill="#0e4a3c" stroke="#0e4a3c" stroke-width="26" stroke-linejoin="round" />

      <a class="foot-link" href="#/about" data-testid="about-link">Tentang</a>

        <span class="dot" aria-hidden="true"></span>

    </footer>

    <script type="module" src="/src/main.ts"></script>
