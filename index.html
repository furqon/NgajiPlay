<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ngajiPlay</title>
    <meta name="description" content="Rekam bacaan Al-Qur'an anak per surah, lalu putar ulang sambil melihat halaman Madani." />
    <!-- %BASE_URL% keeps these correct on a GitHub Pages project subpath. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0e4a3c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ngajiPlay" />
  </head>
  <body>
    <header class="chrome">
      <div class="chrome-row">
        <a class="brand" href="#/" aria-label="ngajiPlay">
          <svg class="mark" viewBox="0 0 512 512" width="28" height="28" aria-hidden="true">
            <circle cx="256" cy="256" r="176" fill="currentColor" />
            <path d="M218 176 L346 256 L218 336 Z" fill="#0e4a3c" stroke="#0e4a3c" stroke-width="26" stroke-linejoin="round" />
          </svg>
          <h1>ngajiPlay</h1>
        </a>
        <div class="chrome-actions" data-testid="chrome-actions">
          <button
            class="status"
            type="button"
            data-testid="status"
            data-state="booting"
            aria-expanded="false"
          >
            <span class="dot" aria-hidden="true"></span>
            <span class="status-text" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="view" class="view"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
